{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password</title>
  <link rel="stylesheet" href="{% static 'manager_profile/css/style.css' %}" />
</head>
<body>
<div class="profile-page">
  <header class="profile-header">
    <div>
      <p class="profile-badge">Change Password</p>
      <h1 class="profile-name">Secure Your Account</h1>
      <p class="profile-role">Update your password with a secure validation flow.</p>
    </div>
  </header>
  <article class="panel-card">
    <form id="changePasswordForm" class="form-grid" method="POST">
      {% csrf_token %}
      <label>Current Password
        <input type="password" name="currentPassword" required />
      </label>
      <label>New Password
        <input type="password" name="newPassword" required minlength="8" />
      </label>
      <label>Confirm New Password
        <input type="password" name="confirmPassword" required minlength="8" />
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Password</button>
        <a class="btn btn-secondary" href="{% url 'manager_profile' %}">Back to Profile</a>
      </div>
    </form>
    {% if messages %}
      {% for message in messages %}
        <p class="message message-{% if message.tags %}{{ message.tags }}{% else %}success{% endif %}">{{ message }}</p>
      {% endfor %}
    {% endif %}
    <p class="message message-success hidden" id="changePasswordSuccess">Password changed successfully.</p>
    <p class="message message-error hidden" id="changePasswordError"></p>
  </article>
</div>
<script>
const form = document.getElementById('changePasswordForm');
const success = document.getElementById('changePasswordSuccess');
const error = document.getElementById('changePasswordError');
form.addEventListener('submit', event => {
  const data = new FormData(form);
  const newPassword = data.get('newPassword');
  const confirmPassword = data.get('confirmPassword');
  if (newPassword !== confirmPassword) {
    event.preventDefault();
    error.textContent = 'New password and confirmation must match.';
    error.classList.remove('hidden');
    success.classList.add('hidden');
  }
});
</script>
</body>
</html>
