{% load static %}

<!DOCTYPE html>
<html
    lang="en"
    data-theme="{{ global_appearance.theme|default:'light' }}"
    {% if global_appearance.high_contrast %}class="high-contrast"{% endif %}
    style="font-size: {{ global_appearance.font_size|default:'16' }}px;"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            FlowDesk
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    <!-- Appearance CSS -->

    <link
        rel="stylesheet"
        href="{% static 'css/appearance.css' %}?v=1"
    >


    {% block extra_css %}
    {% endblock %}

</head>


<body>


    {% block content %}
    {% endblock %}


    {% block extra_js %}
    {% endblock %}


</body>

</html>
