{% load static %}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Projects Dashboard</title>
	<style>
		:root{
	--bg:#fff8f4;
	--bg-2:#fff1e8;
	--card:#ffffff;
	--accent:#f59e7b;
	--accent-2:#f28c5b;
	--danger:#f59e7b;
	--success:#8c5d3c;
	--muted:#7a5c48;
	--border:#f4d9ca;
	--shadow:0 10px 30px rgba(245, 158, 123, 0.16);
	--radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
	margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
	background:var(--bg);color:#111;
}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.header{background:linear-gradient(90deg,var(--bg-2) 0,var(--bg) 100%);box-shadow:var(--shadow)}
.header h1{margin:0;padding:20px 0;font-size:1.4rem}
.container{padding-top:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px}
.card{background:var(--card);padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}
.card h2{margin:0 0 8px 0;font-size:0.95rem;color:var(--muted)}
.stat{font-size:2.2rem;font-weight:700;margin:0}
.stat.overdue{color:var(--danger)}
.assign{background:transparent}
.assign h2{font-size:1.1rem;margin:0 0 12px 0}
.assign-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:var(--card);padding:16px;border-radius:var(--radius);box-shadow:0 6px 18px rgba(20,30,60,0.04)}
.assign-form .field{display:flex;flex-direction:column}
.assign-form .field.full{grid-column:1 / -1}
.assign-form .field span{font-size:0.85rem;color:var(--muted);margin-bottom:6px}
.assign-form input,.assign-form select,.assign-form textarea{padding:10px;border:1px solid var(--border);border-radius:8px;font-size:0.95rem}
.assign-form textarea{min-height:100px;resize:vertical}
.actions{grid-column:1 / -1;display:flex;justify-content:flex-end}
.btn{background:var(--accent);color:#fff;padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--accent-2)}
.btn:active{transform:translateY(1px)}

@media (max-width:700px){
	.assign-form{grid-template-columns:1fr}
	.actions{justify-content:stretch}
	.actions .btn{width:100%}
}


	</style>
	</head>
<body>

<header class="header">
    <div class="wrap">
        <h1>Project Command Center</h1>
    </div>
</header>

<main class="wrap container">

    <!-- Statistics -->
    <section class="stats-grid">

        <div class="card">
            <h2>Total Projects</h2>
            <p class="stat">{{ total_projects }}</p>
        </div>

        <div class="card">
            <h2>Active Projects</h2>
            <p class="stat">{{ active_projects }}</p>
        </div>

        <div class="card">
            <h2>Completed Projects</h2>
            <p class="stat">{{ completed_projects }}</p>
        </div>

        <div class="card">
            <h2>Overdue Projects</h2>
            <p class="stat overdue">{{ overdue_projects }}</p>
        </div>

    </section>

    <!-- Create Project / Task -->

    <section class="assign">

        <h2>Create Project / Assign Task</h2>

        <form
            id="assignForm"
            class="assign-form"
            method="POST"
            enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Project or Task -->

            <label class="field">
                <span>Type</span>

                <select
                    name="projectType"
                    id="projectKind"
                    required>

                    <option value="">Select</option>
                    <option value="Project">Project</option>
                    <option value="Task">Task</option>

                </select>
            </label>

            <!-- Title -->

            <label class="field">
                <span>Title</span>

                <input
                    type="text"
                    name="title"
                    placeholder="Enter title"
                    required>

            </label>

            <!-- Existing Project -->

            <label class="field" id="projectField" style="display:none;">

                <span>linked Project</span>

                <select name="linked_project" id="linkedProject">

                    <option value="">Select Project</option>

                    {% for project in existing_projects %}

                    <option value="{{ project.id }}">
                        {{ project.project_name }}
                    </option>

                    {% endfor %}

                </select>

            </label>

            <!-- Employee -->

            <label class="field">

                <span>Assign To</span>

                <select
                    id="assigneeSelect"
                    required>

                    <option value="">Select Employee</option>

                    {% for employee in employees %}

                    <option
                        data-email="{{ employee.user.email }}"
                        data-name="{{ employee.user.get_full_name }}"
                        data-empid="{{ employee.employee_id }}">

                        {{ employee.user.get_full_name }}

                    </option>

                    {% endfor %}

                </select>

            </label>

            <!-- Description -->

            <label class="field full">

                <span>Description</span>

                <textarea
                    name="description"
                    rows="4"
                    required></textarea>

            </label>

            <!-- Start Date -->

            <label class="field">

                <span>Start Date</span>

                <input
                    type="date"
                    name="start_date"
                    required>

            </label>

            <!-- Due Date -->

            <label class="field">

                <span>Due Date</span>

                <input
                    type="date"
                    name="end_date"
                    required>

            </label>

            <!-- Attachment -->

            <label class="field">

                <span>Attachment</span>

                <input
                    type="file"
                    name="attachment">

            </label>

            <div class="actions">

                <button
                    type="submit"
                    class="btn"
                    id="assignSubmit">

                    Assign

                </button>

            </div>

        </form>

    </section>

</main>

</body>
    <script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("assignForm");
    const submitBtn = document.getElementById("assignSubmit");
    const assigneeSelect = document.getElementById("assigneeSelect");
    const projectKind = document.getElementById("projectKind");
    const projectField = document.getElementById("projectField");
    const linkedProject = document.getElementById("linkedProject");

    function toggleProjectField() {

        if (projectKind.value === "Task") {
            projectField.style.display = "flex";
        } else {
            projectField.style.display = "none";
            linkedProject.value = "";
        }

    }

    projectKind.addEventListener("change", toggleProjectField);

    toggleProjectField();

    form.addEventListener("submit", function (e) {

        if (assigneeSelect.selectedIndex <= 0) {
            e.preventDefault();
            alert("Please select an employee.");
            return;
        }

        if (
            projectKind.value === "Task" &&
            linkedProject.value === ""
        ) {
            e.preventDefault();
            alert("Please select a project.");
            return;
        }

        const option = assigneeSelect.options[
            assigneeSelect.selectedIndex
        ];

        let hidden = document.querySelector(
            'input[name="assigneeDetails"]'
        );

        if (hidden) {
            hidden.remove();
        }

        hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.name = "assigneeDetails";

        hidden.value = JSON.stringify({
            email: option.dataset.email,
            role: "Employee",
            name: option.dataset.name,
            empId: option.dataset.empid
        });

        form.appendChild(hidden);

        submitBtn.disabled = true;
        submitBtn.innerHTML = "Assigning...";
    });

});
</script>
</html>
