{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDesk Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    
        body{
            height:100vh;
            margin:0;
            overflow:hidden;
            display:flex;
            align-items:center;
            background-image:url("{% static 'images/Flowdesk_background.png' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
        }

        .reset-wrapper{
            position:relative;
            width:100%;
            max-width:430px;
        }


        .reset-card{
            width:100%;
            max-width:420px;
            height:97vh;
            padding:20px;
            border-radius:18px;
            border:none;
            background:rgba(255,255,255,.92);
            backdrop-filter:blur(10px);
            box-shadow:0 15px 35px rgba(0,0,0,.3);
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .brand-logo{
            width:60px;
            height:60px;
            border-radius:16px;
            background:linear-gradient(135deg,#ff9a8b);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-weight:bold;
            font-size:24px;
        }

        .form-control:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 .2rem rgba(37,99,235,.25);
        }

        .btn-primary{
            background:linear-gradient(135deg,#ff9a8b);
            border:none;
        }

        .password-wrapper{
            position:relative;
        }

        .password-toggle{
            position:absolute;
            top:50%;
            right:10px;
            transform:translateY(-50%);
            border:none;
            background:transparent;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="container d-flex align-items-center justify-content-start min-vh-100">

    <div class="reset-wrapper">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="card reset-card">

            <div class="text-center mb-4">
                <div class="brand-logo mx-auto mb-3">FD</div>
                <h2 class="fw-bold">Reset Password</h2>
                <p class="text-muted">
                    Enter your email and choose a new password.
                </p>
            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Email</label>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        placeholder="name@example.com"
                        required>
                </div>

                <div class="mb-3">
                    <label>New Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            class="form-control"
                            id="newPassword"
                            name="new_password"
                            required>

                        <button type="button"
                                class="password-toggle"
                                data-target="newPassword">
                            👁
                        </button>
                    </div>

                </div>

                <div class="mb-3">
                    <label>Confirm Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirm_password"
                            required>

                        <button type="button"
                                class="password-toggle"
                                data-target="confirmPassword">
                            👁
                        </button>
                    </div>

                </div>

                <button class="btn btn-primary w-100">
                    Update Password
                </button>

            </form>

            <p class="text-center mt-3">

                <a href="{% url 'login' %}" class="text-decoration-none">
                    Back to Login
                </a>

            </p>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'js/app.js' %}"></script>

<script>

document.querySelectorAll(".password-toggle").forEach(button=>{

button.addEventListener("click",function(){

const input=document.getElementById(this.dataset.target);

if(input.type==="password"){
input.type="text";
this.textContent="🙈";
}
else{
input.type="password";
this.textContent="👁";
}

});

});

</script>

</body>
</html>
