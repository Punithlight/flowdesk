{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDesk Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
        margin: 0;
        height: 100vh;
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        background: url("{% static 'images/Flowdesk_background.png' %}") no-repeat center center fixed;
        background-size: cover;

        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-card {
        width: 100%;
        max-width: 420px;

        height: auto;
        min-height: auto;

        padding: 30px;
        border: none;
        border-radius: 18px;

        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);

        box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.25),
            0 25px 60px rgba(0, 0, 0, 0.20);
    }

    .brand-logo {
        width: 55px;
        height: 55px;
        border-radius: 16px;
        /* Updated FD logo background color to green gradient */
        background: linear-gradient(135deg, #ff9a8b, #ff6a88);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-weight: bold;
        margin: auto;
    }

    .password-wrapper {
        position: relative;
    }

    .password-toggle {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        border: none;
        background: none;
        cursor: pointer;
    }

    .btn-primary {
        /* Updated Login button to match green theme */
        background: linear-gradient(135deg, #ff9a8b, #ff6a88);
        border: none;
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #f88272, #10b981);
    }

    </style>

</head>

<body>

<div class="container">

    <div class="row">

        <div class="col-md-5 col-lg-4">

            <div class="card login-card">

                <div class="text-center mb-3">

                    <div class="brand-logo">
                        FD
                    </div>

                    <h2 class="fw-bold mt-2">FlowDesk</h2>

                    <p class="text-muted">
                        Welcome Back! Please Sign In.
                    </p>

                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter Email"
                        required>
                    </div>

                    <div class="mb-3">

                        <label class="form-label">Password</label>

                        <div class="password-wrapper">

                            <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter Password"
                            required>

                            <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()">

                                👁

                            </button>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Select Designation</label>

                        <select
                        name="role"
                        class="form-select"
                        required>

                            <option value="">Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="manager">Manager</option>
                            <option value="hr">HR</option>
                            <option value="technical team">Technical Team</option>
                            <option value="team lead">Team Lead</option>
                            <option value="employee">Employee</option>

                        </select>

                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <div>
                            <input type="checkbox" name="remember">
                            Remember me
                        </div>

                        <a href="{% url 'forgot_password' %}">
                            Forgot Password?
                        </a>

                    </div>

                    <button
                    type="submit"
                    class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <p class="text-center mt-3 mb-0">

                    Don't have an account?

                    <a href="{% url 'signup' %}">
                        Sign Up
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

<script>

function togglePassword(){

    const x=document.getElementById("password");

    if(x.type==="password"){
        x.type="text";
    }else{
        x.type="password";
    }

}

</script>

</body>
</html>
