{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDesk Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      body{
    margin:0;
    min-height:100vh;
    overflow-y:auto;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
}

/* Fixed Background Image */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:url("{% static 'images/HR background_image.jpeg' %}") no-repeat center center;
    background-size:cover;

    z-index:-1;
}
      .signup-card{
    width:100%;
    max-width:440px;

    max-height:99vh;     
    /* overflow-y:visible;      Scroll only inside the card */

    border:0;
    border-radius:18px;

    background:rgba(255,255,255,.15);
    backdrop-filter:blur(12px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.3),
        0 30px 80px rgba(0,0,0,.3),
        0 0 50px rgba(255,255,255,.3);

    padding:30px;
}

      .brand-logo{
        width:60px;
        height:60px;
        border-radius:16px;
        background:linear-gradient(135deg,#2563eb,#38bdf8);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-size:1.5rem;
        font-weight:bold;
      }

      .password-wrapper{
        position:relative;
      }

      .password-toggle{
        position:absolute;
        right:10px;
        top:50%;
        transform:translateY(-50%);
        border:0;
        background:transparent;
        cursor:pointer;
      }

      .btn-primary{
        background:linear-gradient(135deg,#2563eb,#3b82f6);
        border:none;
      }

      .card{
        background:rgba(255,255,255,.1);
        backdrop-filter:blur(10px);
        border-radius:15px;
      }
    </style>

</head>

<body>

<div class="container d-flex align-items-center justify-content-start min-vh-100 px-4 px-md-5">

<div class="card signup-card p-4 p-md-5 ms-0 ms-md-5">

<div class="text-center mb-4">

<div class="brand-logo mx-auto mb-3">
FD
</div>

<h2 class="fw-bold mb-1">
Create Account
</h2>

<p class="text-muted">
Join FlowDesk and get started.
</p>

</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
Full Name
</label>

<input
type="text"
name="full_name"
class="form-control"
placeholder="John Doe"
required>

</div>

<div class="mb-3">

<label class="form-label">
Email Address
</label>

<input
type="email"
name="email"
class="form-control"
placeholder="name@example.com"
required>

</div>

<div class="mb-3">

<label class="form-label">
Select Designation
</label>

<select
name="role"
class="form-select"
required>

<option value="">Select Role</option>
<option value="admin">Admin</option>
<option value="manager">Manager</option>
<option value="hr">HR</option>
<option value="technical team">Technical Team</option>
<option value="team lead">Team Lead</option>
<option value="employee">Employee</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<div class="password-wrapper">

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="Create Password"
required>

<button
type="button"
class="password-toggle"
onclick="togglePassword('password')">

👁

</button>

</div>

</div>

<div class="mb-3">

<label class="form-label">
Confirm Password
</label>

<div class="password-wrapper">

<input
type="password"
name="confirm_password"
id="confirm_password"
class="form-control"
placeholder="Confirm Password"
required>

<button
type="button"
class="password-toggle"
onclick="togglePassword('confirm_password')">

👁

</button>

</div>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Sign Up

</button>

</form>

<p class="text-center mt-3">

Already have an account?

<a href="{% url 'login' %}" class="text-decoration-none fw-semibold">

Sign In

</a>

</p>

</div>

</div>

<script>

function togglePassword(id){

const input=document.getElementById(id);

if(input.type==="password"){

input.type="text";

}else{

input.type="password";

}

}

</script>

</body>
</html>
